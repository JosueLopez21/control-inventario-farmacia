name: control-inventario-farmacia

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:10000"
    environment:
      APP_NAME: FarmaSalud
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY en el entorno antes de levantar el contenedor}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: America/La_Paz
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: farmacia_inventario
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: farmacia_inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - farmacia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmacia_inventario"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  farmacia_pgdata:
